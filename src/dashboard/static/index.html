<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Agent Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top-bar">
    <h1>Media Agent</h1>
    <button id="refresh" type="button">Refresh</button>
    <span id="status"></span>
  </header>

  <section id="health-band" class="health-band" aria-label="Pipeline health"></section>

  <div class="main-grid">
    <div class="panel work-area-wrap">
      <div class="work-area">
        <div>
          <h2>Review queue</h2>
          <div id="review-queue"></div>
        </div>
        <div>
          <h2>Calendar</h2>
          <div class="calendar-nav">
            <button type="button" id="prev-month" class="secondary">&larr;</button>
            <span id="month-label"></span>
            <button type="button" id="next-month" class="secondary">&rarr;</button>
          </div>
          <div id="calendar" class="calendar-grid"></div>
        </div>
      </div>
    </div>

    <aside class="panel">
      <h2>Alerts</h2>
      <div id="alerts-rail" class="alerts-rail"></div>
    </aside>
  </div>

  <details class="uploads-panel panel" open>
    <summary>Uploaded clips</summary>
    <ul id="uploaded" class="uploaded-list"></ul>
  </details>

  <script src="/app.js"></script>
</body>
</html>
